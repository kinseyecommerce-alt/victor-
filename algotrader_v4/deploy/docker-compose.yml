services:
  algotrader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8000:8000"    # only bind localhost; nginx terminates TLS
    volumes:
      - ../logs:/app/logs         # persist trade logs on host
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

  # Optional: uncomment to add nginx SSL termination via Docker
