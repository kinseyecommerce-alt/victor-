# /etc/nginx/sites-available/algotrader
# Place symlink: ln -s /etc/nginx/sites-available/algotrader /etc/nginx/sites-enabled/

upstream algotrader_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # TLS — managed by certbot; paths filled in automatically after:
    #   certbot --nginx -d yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Proxy all traffic to uvicorn
    location / {
        proxy_pass         http://algotrader_app;
        proxy_http_version 1.1;

        # WebSocket upgrade (tick engine / live P&L stream)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;   # allow long-polling / WS connections
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        proxy_buffering off;        # stream responses (SSE / WS)
    }
}
